# Craft Agents Web - Docker Compose
#
# Usage:
#   cp apps/web/.env.example apps/web/.env   # 填写环境变量
#   docker compose up --build                 # 启动
#   docker compose up -d                      # 后台运行
#   docker compose logs -f web                # 查看日志

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - apps/web/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/api/sandbox/info').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
